  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  iconsax: ^0.0.8
  flutter_colorpicker: ^1.1.0
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.15.3
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
